<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <link rel="preload" as="image" href="assets/shop-detail-renhe.webp">
  <title>人和馆·上海菜(静安寺店) - 商户详情</title>
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (sessionStorage.getItem('shopDetailTransition')) {
      document.documentElement.style.opacity = '0';
      window.scrollTo(0, 0);
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      background: #F5F5F5;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    .detail-page { position: relative; width: 100%; }
    .detail-page__img { width: 100%; height: auto; display: block; }
    .detail-page__back {
      position: fixed;
      top: 10.26vw;
      left: 1.28vw;
      width: 12.82vw;
      height: 12.82vw;
      z-index: 100;
      cursor: pointer;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="detail-page">
    <a class="detail-page__back" id="backBtn"></a>
    <img class="detail-page__img" src="assets/shop-detail-renhe.webp" alt="人和馆·上海菜(静安寺店) 商户详情">
  </div>
  <script>
    (function() {
      var fromShopList = sessionStorage.getItem('shopDetailTransition');
      if (fromShopList) {
        sessionStorage.removeItem('shopDetailTransition');
        window.scrollTo(0, 0);
        document.documentElement.style.transition = 'opacity 0.09s cubic-bezier(0.16, 1, 0.3, 1)';
        var fadedIn = false;
        function doFadeIn() {
          if (fadedIn) return;
          fadedIn = true;
          document.documentElement.style.opacity = '1';
        }
        requestAnimationFrame(function() { requestAnimationFrame(doFadeIn); });
        setTimeout(doFadeIn, 32);
      }
    })();
    document.getElementById('backBtn').addEventListener('click', function(e) {
      e.preventDefault();
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = 'index.html'; }
    });
  </script>
</body>
</html>
